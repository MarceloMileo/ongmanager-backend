name: CI

on: push

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, pdo_pgsql, zip, sockets

      - name: Check PHP version
        run: php -v

      - name: Say hello
        run: echo "Meu primeiro workflow rodando!!!"
